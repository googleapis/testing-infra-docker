# note: /workspace is a special directory in the docker image where all the files in this folder
# get placed on your behalf

timeout: 7200s
steps:

  # Go 1.25 build
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/go125", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/go125:infrastructure-public-image-$COMMIT_SHA", "."]
    dir: go/go125
    id: go125-build
    waitFor: ["-"]
  - name: gcr.io/gcp-runtimes/structure_test
    args:
      [
        "-i",
        "us-central1-docker.pkg.dev/$PROJECT_ID/go125",
        "--config",
        "/workspace/go/go125.yaml",
        "-v",
      ]
    waitFor: ["go125-build"]

  # Go 1.26 build
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/go126", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/go126:infrastructure-public-image-$COMMIT_SHA", "."]
    dir: go/go126
    id: go126-build
    waitFor: ["-"]
  - name: gcr.io/gcp-runtimes/structure_test
    args:
      [
        "-i",
        "us-central1-docker.pkg.dev/$PROJECT_ID/go126",
        "--config",
        "/workspace/go/go126.yaml",
        "-v",
      ]
    waitFor: ["go126-build"]

    # Go 1.27 build
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/go127", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/go127:infrastructure-public-image-$COMMIT_SHA", "."]
    dir: go/go127
    id: go127-build
    waitFor: ["-"]
  - name: gcr.io/gcp-runtimes/structure_test
    args:
      [
        "-i",
        "us-central1-docker.pkg.dev/$PROJECT_ID/go127",
        "--config",
        "/workspace/go/go127.yaml",
        "-v",
      ]
    waitFor: ["go127-build"]

  # Go 1.25 release build
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/release-images/go125", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/release-images/go125:infrastructure-public-image-$COMMIT_SHA", "."]
    dir: go/go125-release
    id: go125-release-build
    waitFor: ["-"]
  - name: gcr.io/gcp-runtimes/structure_test
    args:
      [
        "-i",
        "us-central1-docker.pkg.dev/$PROJECT_ID/release-images/go125",
        "--config",
        "/workspace/go/go125-release.yaml",
        "-v",
      ]
    waitFor: ["go125-release-build"]

  # Go 1.26 release build
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/release-images/go126", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/release-images/go126:infrastructure-public-image-$COMMIT_SHA", "."]
    dir: go/go126-release
    id: go126-release-build
    waitFor: ["-"]
  - name: gcr.io/gcp-runtimes/structure_test
    args:
      [
        "-i",
        "us-central1-docker.pkg.dev/$PROJECT_ID/release-images/go126",
        "--config",
        "/workspace/go/go126-release.yaml",
        "-v",
      ]
    waitFor: ["go126-release-build"]

    # Go 1.27 release build
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/release-images/go127", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/release-images/go127:infrastructure-public-image-$COMMIT_SHA", "."]
    dir: go/go127-release
    id: go127-release-build
    waitFor: ["-"]
  - name: gcr.io/gcp-runtimes/structure_test
    args:
      [
        "-i",
        "us-central1-docker.pkg.dev/$PROJECT_ID/release-images/go127",
        "--config",
        "/workspace/go/go127-release.yaml",
        "-v",
      ]
    waitFor: ["go127-release-build"]
