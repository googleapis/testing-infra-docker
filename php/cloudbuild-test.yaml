# note: all local files are placed under /workspace and are required in path

timeout: 28800s  # 8 hours
options:
 machineType: 'E2_HIGHCPU_8'
steps:

# PHP release
- id: 'build-php-release'
  name: gcr.io/cloud-builders/docker
  args:
    ['build', '-t', 'gcr.io/cloud-devrel-kokoro-resources/release', '-t', 'gcr.io/cloud-devrel-public-resources/release', '-t', 'gcr.io/cloud-devrel-public-resources/release:infrastructure-public-image-$COMMIT_SHA', '.']
  dir: 'php/release'
  waitFor: ['-']

- name: gcr.io/gcp-runtimes/structure_test
  args:
    ['-i', 'gcr.io/cloud-devrel-kokoro-resources/release', '--config', '/workspace/php/release.yaml', '-v']
  waitFor: ['build-php-release']
